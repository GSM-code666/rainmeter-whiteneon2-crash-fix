[Rainmeter]
Update=16
Author=Connect-R
DynamicWindowSize=1
AccurateText=1
ContextTitle="Dock Settings"
ContextAction=!Execute ["#ROOTCONFIGPATH#@Resources\Variables.inc"]

[ScriptHover]
Measure=Script
ScriptFile=#@#Scripts\HoverAnim.lua
Disabled=1



[Variables]
@include=#@#Variables.inc

;----------------------Dock Settings--------------------------
;-------------------------------------------------------------

