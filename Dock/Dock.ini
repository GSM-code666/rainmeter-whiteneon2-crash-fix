[MeterIcon1]
Meter=Image
ImageName=#Icon1NameAndPath#
X=60
Y=30
w=35
LeftMouseUpAction=["#LocationPath1#"]
MouseOverAction=[!CommandMeasure ScriptHover "SetHover(1, 1)"]
MouseLeaveAction=[!CommandMeasure ScriptHover "SetHover(1, 0)"]
AntiAlias=1
PreserveAspectRatio=1
Group=Icons
SolidColor=0,0,0,1

