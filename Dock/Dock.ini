[Rainmeter]
Update=16
Author=Connect-R
DynamicWindowSize=1
AccurateText=1
ContextTitle="Dock Settings"
ContextAction=!Execute ["#ROOTCONFIGPATH#@Resources\Variables.inc"]

[ScriptHover]
Measure=Script
ScriptFile=#@#Scripts\HoverAnim.lua
Disabled=1



[Variables]
@include=#@#Variables.inc

;----------------------Dock Settings--------------------------
;-------------------------------------------------------------

Icon1NameAndPath=#@#\01.png
LocationPath1=explorer.exe

Icon2NameAndPath=#@#\02.png
LocationPath2=D:\Downloads

Icon3NameAndPath=#@#\03.png
LocationPath3=C:\Users\ghana\AppData\Local\Discord\Discord.exe

Icon4NameAndPath=#@#\brave_logo.png
LocationPath4=C:\Program Files\BraveSoftware\Brave-Browser\Application\brave.exe

Icon5NameAndPath=#@#\vmware_logo.png
LocationPath5=E:\Vmware file\vmware.exe

Icon6NameAndPath=#@#\steam_logo.png
LocationPath6=D:\Steam\steam.exe

Icon7NameAndPath=#@#\revo_logo.png
LocationPath7=E:\revo_uninstaller\Revo Uninstaller\RevoUnin.exe

Icon8NameAndPath=#@#\setting.png
LocationPath8=ms-settings:

Icon9NameAndPath=#@#\ms_store_logo.png
LocationPath9=ms-windows-store:

Icon10NameAndPath=#@#\vs_code.png
